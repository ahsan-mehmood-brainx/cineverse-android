[config]
# Qodo PR-Agent model. Must be a model your OpenAI project has access to.
model = "gpt-4.1-mini"
fallback_models = ["gpt-4.1-mini"]

[ignore]
# Keeps large test files from eating the diff-token budget and silently
# pushing other changed files out of the review. Only affects Qodo
# PR-Agent's own review/description pass — the separate compliance script
# (scripts/android_pr_review.js) reads the full `git diff` directly and
# still evaluates test files against testing_compliance_checklist.yaml.
glob = ["**/*Test.kt", "**/*Test.java", "**/androidTest/**", "**/test/**"]

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
require_focused_review = false
extra_instructions = """
This is a native Android project written in Kotlin, using a mix of Jetpack Compose and XML Views.
Pay attention to ViewModel/Compose state handling, coroutine lifecycle safety, and Gradle/manifest changes.

A separate, more thorough compliance pass runs after this review (scripts/android_pr_review.js) against
pr_compliance_checklist.yaml, testing_compliance_checklist.yaml, prd_compliance_checklist.yaml, and
best_practices.md — you do not need to be exhaustive against those checklists yourself, but flag anything
a senior Android engineer would raise.
"""

[pr_description]
publish_labels = true
add_original_user_description = true

[pr_code_suggestions]
num_code_suggestions = 4
extra_instructions = """
Prefer suggestions aligned with Kotlin idioms (null-safety, sealed classes, coroutines) over Java-style patterns.
"""

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = false
